<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkTank - Gameplay</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/audio.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .icon-img {
            width: 1em;
            height: 1em;
            object-fit: contain;
            vertical-align: middle;
        }
        .level-icon-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }
        .back-icon-img {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }
        .point-icon-img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            vertical-align: middle;
        }
        .check-icon-img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #e0e0e0;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px),
                linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .main-content {
            padding: 20px;
            padding-bottom: 140px;
            max-width: 700px;
            margin: 0 auto;
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.1);
        }
        .back-btn {
            width: 44px;
            height: 44px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        .level-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .level-icon { font-size: 28px; }
        .level-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
            letter-spacing: 1px;
        }
        .question-counter {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(255, 0, 255, 0.2) 100%);
            border: 1px solid rgba(255, 0, 255, 0.3);
            padding: 8px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #ff00ff;
        }

        /* Question Card */
        .question-card {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }
        .question-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #a855f7, #ff00ff);
        }
        .question-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 19px;
            color: #fff;
            line-height: 1.5;
        }

        /* Instruction */
        .instruction {
            font-size: 16px;
            color: #888;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .instruction strong {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }

        /* Steps */
        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .step {
            background: rgba(20, 20, 30, 0.8);
            border: 1px solid rgba(0, 240, 255, 0.2);
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            gap: 14px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }
        .step:hover {
            border-color: rgba(0, 240, 255, 0.4);
            background: rgba(0, 240, 255, 0.05);
        }
        .step.selected {
            background: rgba(255, 51, 102, 0.15);
            border-color: rgba(255, 51, 102, 0.5);
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.2), inset 0 0 30px rgba(255, 51, 102, 0.05);
        }
        .step-number {
            width: 32px;
            height: 32px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #00f0ff;
            flex-shrink: 0;
        }
        .step.selected .step-number {
            background: rgba(255, 51, 102, 0.3);
            border-color: #ff3366;
            color: #ff3366;
        }
        .step-content { flex: 1; }
        .step-type {
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            padding: 3px 10px;
            display: inline-block;
        }
        .step-type.thinking {
            background: rgba(0, 240, 255, 0.2);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
        }
        .step-type.calculation {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }
        .step-type.verification {
            background: rgba(240, 255, 0, 0.2);
            border: 1px solid rgba(240, 255, 0, 0.3);
            color: #f0ff00;
        }
        .step-type.conclusion {
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
        }
        .step-text {
            font-size: 16px;
            color: #ddd;
            line-height: 1.5;
        }
        .step-check {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(0, 240, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .step.selected .step-check {
            background: #ff3366;
            border-color: #ff3366;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }
        .step.selected .step-check::after {
            content: '✓';
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        /* Final Answer */
        .final-answer {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            padding: 14px 18px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .final-answer-icon { font-size: 22px; }
        .final-answer-text {
            font-size: 16px;
            color: #00ff88;
        }
        .final-answer-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        /* Bottom Section */
        .bottom-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.98) 80%, transparent);
            padding: 20px;
            padding-bottom: 30px;
            z-index: 100;
        }
        .bottom-inner {
            max-width: 700px;
            margin: 0 auto;
        }
        .marked-count {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            color: #888;
        }
        .marked-count span {
            font-family: 'Orbitron', sans-serif;
            color: #ff3366;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }
        .submit-btn {
            width: 100%;
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
        }
        .submit-btn:hover:not(.disabled) {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), inset 0 0 30px rgba(0, 240, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .submit-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #666;
            color: #666;
        }

        @media (min-width: 768px) {
            .main-content {
                padding: 40px;
                padding-bottom: 160px;
            }
            .question-card { padding: 24px; }
            .question-text { font-size: 18px; }
            .step { padding: 20px; }
            .step-text { font-size: 15px; }
        }
    </style>
</head>
<body>
    <main class="main-content">
        <div class="game-header">
            <a href="levels.html" class="back-btn" onclick="ThinkTankAudio.click()"><img src="assets/images/Back-arrow.png" alt="Back" class="back-icon-img"></a>
            <div class="level-indicator">
                <span class="level-icon" id="levelIcon"><img src="assets/images/Novice.png" alt="Level" class="level-icon-img" id="levelIconImg"></span>
                <span class="level-name" id="levelName">NOVICE</span>
            </div>
            <div class="question-counter" id="questionCounter">01/20</div>
        </div>
        <div id="content"></div>
    </main>

    <div class="bottom-section">
        <div class="bottom-inner">
            <div class="marked-count">
                <span id="markedCount">0</span> steps flagged as wasteful
            </div>
            <button class="submit-btn disabled" id="submitBtn" onclick="submitJudgment()">[ Read steps... 8s ]</button>
        </div>
    </div>

    <script>
        // Fallback chains for demo mode
        const fallbackChains = {
            novice: [
                {
                    id: 'n1',
                    question: 'What is 15% of 80?',
                    steps: [
                        { type: 'thinking', content: 'I need to calculate 15% of 80. To do this, I\'ll convert the percentage to a decimal.' },
                        { type: 'calculation', content: '15% = 15/100 = 0.15' },
                        { type: 'verification', content: 'Let me double-check: 15 divided by 100 is indeed 0.15. Yes, that\'s correct.' },
                        { type: 'calculation', content: '0.15 × 80 = 12' },
                        { type: 'verification', content: 'Let me verify this multiplication: 0.15 × 80. I\'ll break it down: 0.1 × 80 = 8, and 0.05 × 80 = 4. So 8 + 4 = 12. Correct!' },
                        { type: 'conclusion', content: 'The answer is 12.' }
                    ],
                    answer: '12'
                },
                {
                    id: 'n2',
                    question: 'If a train travels at 60 mph, how far does it go in 2.5 hours?',
                    steps: [
                        { type: 'thinking', content: 'I need to find distance. The formula is: Distance = Speed × Time.' },
                        { type: 'thinking', content: 'Let me restate the problem: A train going 60 mph for 2.5 hours.' },
                        { type: 'calculation', content: 'Distance = 60 × 2.5' },
                        { type: 'calculation', content: '60 × 2.5 = 60 × 2 + 60 × 0.5 = 120 + 30 = 150' },
                        { type: 'verification', content: 'Let me check: 60 × 2.5. Yes, that\'s 150 miles.' },
                        { type: 'conclusion', content: 'The train travels 150 miles.' }
                    ],
                    answer: '150 miles'
                }
            ],
            apprentice: [
                {
                    id: 'a1',
                    question: 'A store has a 25% off sale. If a jacket originally costs $80, what is the sale price?',
                    steps: [
                        { type: 'thinking', content: 'I need to find the sale price after a 25% discount on $80.' },
                        { type: 'thinking', content: 'So the question is asking: what is $80 minus 25% of $80?' },
                        { type: 'calculation', content: 'First, calculate the discount: 25% of $80 = 0.25 × 80 = $20' },
                        { type: 'thinking', content: 'Now I need to subtract this discount from the original price.' },
                        { type: 'calculation', content: 'Sale price = $80 - $20 = $60' },
                        { type: 'verification', content: 'Alternatively, I could calculate 75% of $80 directly: 0.75 × 80 = $60. Same answer!' },
                        { type: 'conclusion', content: 'The sale price is $60.' }
                    ],
                    answer: '$60'
                }
            ],
            expert: [
                {
                    id: 'e1',
                    question: 'A population doubles every 10 years. If it starts at 1000, what will it be in 30 years?',
                    steps: [
                        { type: 'thinking', content: 'This is exponential growth. The population doubles every 10 years.' },
                        { type: 'calculation', content: 'After 10 years: 1000 × 2 = 2000' },
                        { type: 'thinking', content: 'I should verify my approach. Doubling means multiplying by 2 each period.' },
                        { type: 'calculation', content: 'After 20 years: 2000 × 2 = 4000' },
                        { type: 'calculation', content: 'After 30 years: 4000 × 2 = 8000' },
                        { type: 'conclusion', content: 'The population will be 8000.' }
                    ],
                    answer: '8000'
                }
            ],
            master: [
                {
                    id: 'm1',
                    question: 'A car depreciates by 15% each year. If it\'s worth $20,000 now, what was its value 2 years ago?',
                    steps: [
                        { type: 'thinking', content: 'This is reverse depreciation. I need to work backwards.' },
                        { type: 'thinking', content: 'If the car loses 15% each year, it retains 85% of its value.' },
                        { type: 'calculation', content: 'To go back: Original = Current ÷ 0.85²' },
                        { type: 'calculation', content: '0.85² = 0.7225' },
                        { type: 'verification', content: 'Let me verify: 0.85 × 0.85 = 0.7225. Yes.' },
                        { type: 'calculation', content: 'Original = $20,000 ÷ 0.7225 = $27,681.66' },
                        { type: 'conclusion', content: 'The car was worth approximately $27,682 two years ago.' }
                    ],
                    answer: '~$27,682'
                }
            ]
        };

        let currentLevel = 'novice';
        let currentChain = null;
        let selectedSteps = new Set();
        let startTime = null;
        let submitEnabled = false;
        let submitTimer = null;
        let countdownSeconds = 8;

        // Anti-skip: Enable submit after 8 seconds OR when user flags a step
        function startSubmitCountdown() {
            submitEnabled = false;
            countdownSeconds = 8;
            const btn = document.getElementById('submitBtn');
            btn.classList.add('disabled');
            btn.textContent = `[ Read steps... ${countdownSeconds}s ]`;

            if (submitTimer) clearInterval(submitTimer);

            submitTimer = setInterval(() => {
                countdownSeconds--;
                if (countdownSeconds <= 0) {
                    enableSubmit();
                    clearInterval(submitTimer);
                } else if (!submitEnabled) {
                    btn.textContent = `[ Read steps... ${countdownSeconds}s ]`;
                }
            }, 1000);
        }

        function enableSubmit() {
            if (submitEnabled) return;
            submitEnabled = true;
            const btn = document.getElementById('submitBtn');
            btn.classList.remove('disabled');
            btn.textContent = '[ Submit Analysis ]';
            if (submitTimer) {
                clearInterval(submitTimer);
                submitTimer = null;
            }
        }

        async function loadQuestion() {
            await ThinkTankApp.init();
            const profile = await ThinkTankApp.getProfile();

            if (!profile) {
                window.location.href = 'index.html';
                return;
            }

            currentLevel = localStorage.getItem('thinktank_current_level') || 'novice';

            const levelImages = { novice: 'assets/images/Novice.png', apprentice: 'assets/images/Apprentice.png', expert: 'assets/images/Expert.png', master: 'assets/images/Master.png' };
            const levelNames = { novice: 'NOVICE', apprentice: 'APPRENTICE', expert: 'EXPERT', master: 'MASTER' };

            document.getElementById('levelIconImg').src = levelImages[currentLevel];
            document.getElementById('levelName').textContent = levelNames[currentLevel];

            const levelsCompleted = profile.levels_completed || profile.levelsCompleted || {};
            const completed = levelsCompleted[currentLevel] || 0;
            document.getElementById('questionCounter').textContent = String(completed + 1).padStart(2, '0') + '/20';

            // Try to fetch from Supabase, fallback to local chains
            let chain = await ThinkTankApp.getRandomChain('calibration', currentLevel);

            if (!chain) {
                // Fallback to local chains
                const chains = fallbackChains[currentLevel];
                chain = chains[Math.floor(Math.random() * chains.length)];
            }

            currentChain = chain;
            startTime = Date.now();
            renderQuestion();
        }

        function renderQuestion() {
            let stepsHTML = '';
            currentChain.steps.forEach((step, index) => {
                stepsHTML += `
                    <div class="step" id="step-${index}" onclick="toggleStep(${index})">
                        <div class="step-number">${String(index + 1).padStart(2, '0')}</div>
                        <div class="step-content">
                            <span class="step-type ${step.type}">${step.type}</span>
                            <div class="step-text">${step.content}</div>
                        </div>
                        <div class="step-check"></div>
                    </div>
                `;
            });

            document.getElementById('content').innerHTML = `
                <div class="question-card">
                    <div class="question-label">// Query Input</div>
                    <div class="question-text">${currentChain.question}</div>
                </div>
                <div class="instruction">
                    <img src="assets/images/Point-icon.png" alt="Point" class="point-icon-img"> Flag steps that are <strong>WASTEFUL</strong> or redundant
                </div>
                <div class="steps-container">${stepsHTML}</div>
                <div class="final-answer">
                    <span class="final-answer-icon"><img src="assets/images/Checkmark.png" alt="Answer" class="check-icon-img"></span>
                    <span class="final-answer-text">Output: <span class="final-answer-value">${currentChain.answer}</span></span>
                </div>
            `;
            selectedSteps.clear();
            updateMarkedCount();
            startSubmitCountdown();
        }

        function toggleStep(index) {
            ThinkTankAudio.click();
            const stepElement = document.getElementById(`step-${index}`);
            if (selectedSteps.has(index)) {
                selectedSteps.delete(index);
                stepElement.classList.remove('selected');
            } else {
                selectedSteps.add(index);
                stepElement.classList.add('selected');
                // Enable submit when user flags at least one step
                enableSubmit();
            }
            updateMarkedCount();
        }

        function updateMarkedCount() {
            document.getElementById('markedCount').textContent = selectedSteps.size;
        }

        async function submitJudgment() {
            // Anti-skip check
            if (!submitEnabled) return;

            ThinkTankAudio.click();
            const timeTaken = startTime ? Date.now() - startTime : null;
            const steps = currentChain.steps || [];

            // Submit judgment via ThinkTankApp
            const result = await ThinkTankApp.submitJudgment({
                chainId: currentChain.id || null,
                flaggedSteps: Array.from(selectedSteps),
                totalSteps: steps.length,
                timeTakenMs: timeTaken,
                mode: 'calibration',
                level: currentLevel
            });

            // Get updated profile
            const profile = await ThinkTankApp.getProfile();
            const pointsPerLevel = { novice: 1, apprentice: 2, expert: 3, master: 4 };
            const pointsEarned = pointsPerLevel[currentLevel];
            const levelsCompleted = profile.levels_completed || profile.levelsCompleted || {};

            // Store result for result page
            localStorage.setItem('thinktank_last_result', JSON.stringify({
                level: currentLevel,
                pointsEarned: pointsEarned,
                totalPoints: profile.points || 0,
                markedSteps: Array.from(selectedSteps),
                totalSteps: steps.length,
                unlockedLevel: result.unlockedLevel,
                levelCompleted: levelsCompleted[currentLevel] || 0
            }));

            window.location.href = 'result.html';
        }

        loadQuestion();
    </script>
</body>
</html>
