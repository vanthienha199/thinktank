<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkTank - AI Reasoning Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/audio.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .icon-img {
            width: 1em;
            height: 1em;
            object-fit: contain;
            vertical-align: middle;
        }
        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            vertical-align: middle;
        }
        .feature-icon-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        /* Animated background grid */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }
        /* Scanline effect */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }
        .splash-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite, glitch 5s infinite;
            filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8));
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes glitch {
            0%, 90%, 100% { transform: scale(1) translate(0); filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)); }
            92% { transform: scale(1) translate(-2px, 1px); filter: drop-shadow(0 0 30px rgba(255, 0, 255, 0.8)); }
            94% { transform: scale(1) translate(2px, -1px); filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.8)); }
            96% { transform: scale(1) translate(-1px, 2px); filter: drop-shadow(0 0 30px rgba(255, 0, 255, 0.8)); }
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00f0ff 0%, #ff00ff 50%, #00f0ff 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            letter-spacing: 4px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .tagline {
            font-size: 20px;
            color: #00f0ff;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .start-btn {
            background: transparent;
            border: 2px solid #00f0ff;
            color: #00f0ff;
            padding: 18px 60px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 2px;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .start-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(255, 0, 255, 0.2));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .start-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), inset 0 0 30px rgba(0, 240, 255, 0.1);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }
        .start-btn:hover::before {
            opacity: 1;
        }
        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .feature {
            text-align: center;
        }
        .feature-icon {
            font-size: 32px;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(255, 0, 255, 0.5));
        }
        .feature-text {
            font-size: 14px;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .research-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.3);
            padding: 12px 24px;
            margin-top: 40px;
            font-size: 16px;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }
        .version {
            margin-top: 30px;
            font-size: 12px;
            color: #333;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        @media (min-width: 768px) {
            .logo-img { width: 100px; height: 100px; }
            .title { font-size: 64px; }
            .tagline { font-size: 20px; }
            .start-btn {
                padding: 20px 80px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo"><img src="assets/images/Brain.png" alt="ThinkTank" class="logo-img"></div>
        <h1 class="title">THINKTANK</h1>
        <p class="tagline">Train AI to Think Smarter</p>
        <button class="start-btn" onclick="startGame()">[ Initialize ]</button>

        <div class="features">
            <div class="feature">
                <div class="feature-icon"><img src="assets/images/Target.png" alt="Games" class="feature-icon-img"></div>
                <div class="feature-text">Neural Games</div>
            </div>
            <div class="feature">
                <div class="feature-icon"><img src="assets/images/Trophy.png" alt="Leaderboard" class="feature-icon-img"></div>
                <div class="feature-text">Global Net</div>
            </div>
            <div class="feature">
                <div class="feature-icon"><img src="assets/images/Research.png" alt="Research" class="feature-icon-img"></div>
                <div class="feature-text">AI Research</div>
            </div>
        </div>

        <div class="research-badge">
            <img src="assets/images/Lightning-bolt.png" alt="" class="icon-img"> Contributing to AI Research
        </div>

        <div class="version">v1.0.0 // DEMO BUILD</div>
    </div>

    <script>
        async function startGame() {
            ThinkTankAudio.click();
            await ThinkTankApp.init();
            const loggedIn = await ThinkTankApp.isLoggedIn();
            if (loggedIn) {
                window.location.href = 'home.html';
            } else {
                window.location.href = 'onboarding.html';
            }
        }
    </script>
</body>
</html>
